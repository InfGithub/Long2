name: Publish Maven repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
        default: v0.1.2
        type: string

permissions:
  contents: read

concurrency:
  group: maven-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test Maven repository publisher
        run: python -m unittest discover -s src/test/python -p test_maven_repository.py -v
      - name: Restore published versions
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          mkdir -p target
          git ls-remote --heads "$repository_url" > target/remote-heads.txt
          if grep -q 'refs/heads/maven-repository$' target/remote-heads.txt; then
            git clone --depth 1 --branch maven-repository "$repository_url" target/maven-site
          else
            git init -b maven-repository target/maven-site
            git -C target/maven-site remote add origin "$repository_url"
          fi
      - name: Publish release artifacts
        run: python scripts/publish_maven.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --site target/maven-site
      - name: Preserve repository history
        shell: bash
        run: |
          set -euo pipefail
          git -C target/maven-site config user.name 'github-actions[bot]'
          git -C target/maven-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C target/maven-site add .
          if ! git -C target/maven-site diff --cached --quiet; then
            git -C target/maven-site commit -m "Publish ${RELEASE_TAG} to Maven repository"
            git -C target/maven-site push origin HEAD:refs/heads/maven-repository
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/maven-pages
          git -C target/maven-site archive HEAD | tar -x -C target/maven-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/maven-pages

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Maven repository
        id: deployment
        uses: actions/deploy-pages@v4
